<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ai Bảo Hắn Tu Tiên — Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=LXGW+WenKai&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1118;
      --bg-elevated: #141c27;
      --panel: #1a2433;
      --ink: #e8edf4;
      --muted: #8b9bb3;
      --accent: #c9a227;
      --accent-soft: #c9a22733;
      --border: #2a3545;
      --serif: "LXGW WenKai", "Noto Serif SC", "Source Serif 4", Georgia, serif;
      --sans: "Be Vietnam Pro", "Segoe UI", sans-serif;
      --reader-width: 42rem;
      --font-size: 1.05rem;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 0% 0%, #1a2a3a88 0%, transparent 55%),
        radial-gradient(700px 400px at 100% 10%, #c9a22718 0%, transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    button, input { font: inherit; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #0c1118ee;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      flex: 1;
    }
    .brand img {
      width: 36px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand-text h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-text p {
      margin: 0.1rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }
    .icon-btn, .text-btn {
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--ink);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .icon-btn {
      width: 2.25rem;
      height: 2.25rem;
      display: grid;
      place-items: center;
      font-size: 1rem;
    }
    .text-btn {
      padding: 0.45rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .icon-btn:hover, .text-btn:hover { border-color: var(--accent); background: var(--panel); }
    .main { flex: 1; display: flex; justify-content: center; padding: 1rem 1rem 5.5rem; }
    .view { width: min(100%, calc(var(--reader-width) + 2rem)); }
    .landing {
      display: grid;
      gap: 1.25rem;
      padding: 1rem 0 2rem;
    }
    .hero {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 1rem;
      align-items: start;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(145deg, var(--bg-elevated), var(--panel));
    }
    .hero-cover {
      width: 120px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px #00000055;
    }
    .hero h2 {
      margin: 0 0 0.35rem;
      font-family: var(--serif);
      font-size: 1.45rem;
      color: var(--accent);
    }
    .hero .meta { color: var(--muted); font-size: 0.88rem; line-height: 1.5; }
    .hero .cta {
      margin-top: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .primary-btn {
      border: none;
      background: linear-gradient(135deg, #d4af37, #a67c00);
      color: #1a1200;
      font-weight: 700;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }
    .secondary-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink);
      border-radius: 10px;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }
    .quick-jump {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-elevated);
    }
    .quick-jump label { font-size: 0.82rem; color: var(--muted); }
    .quick-jump input {
      width: 5.5rem;
      padding: 0.45rem 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
    }
    .reader-panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-elevated);
      overflow: hidden;
    }
    .reader-head {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .reader-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.25rem;
      line-height: 1.4;
      color: var(--accent);
    }
    .reader-head .sub {
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .chapter-body {
      padding: 1.25rem 1.25rem 1.5rem;
      font-family: var(--serif);
      font-size: var(--font-size);
      line-height: 1.85;
      color: #dfe6f0;
    }
    .chapter-body p { margin: 0 0 1rem; }
    .chapter-body p:last-child { margin-bottom: 0; }
    .loading, .error {
      padding: 2rem 1.25rem;
      text-align: center;
      color: var(--muted);
    }
    .error { color: #f87171; }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.5rem;
      align-items: center;
      padding: 0.65rem 0.85rem calc(0.65rem + env(safe-area-inset-bottom));
      background: #0c1118f0;
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
    }
    .bottom-nav button {
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--ink);
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
    }
    .bottom-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .bottom-nav .center {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: #00000088;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(100%, 360px);
      height: 100%;
      z-index: 40;
      background: var(--bg-elevated);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .drawer-header h3 { margin: 0; font-size: 1rem; }
    .search-box {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
    }
    .toc {
      overflow: auto;
      flex: 1;
      padding: 0.5rem;
    }
    .toc-item {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--ink);
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.86rem;
      line-height: 1.35;
    }
    .toc-item:hover { background: var(--panel); }
    .toc-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .toc-empty {
      padding: 1rem;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }
    .hidden { display: none !important; }
    @media (max-width: 640px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .hero-cover { margin: 0 auto; }
      .hero .cta { justify-content: center; }
      .brand img { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img src="cover.jpeg" alt="Bìa truyện" onerror="this.style.display='none'">
        <div class="brand-text">
          <h1 id="headerTitle">Ai Bảo Hắn Tu Tiên</h1>
          <p id="headerSub">Tối Bạch Đích Ô Nha</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="fontDownBtn" title="Giảm cỡ chữ" aria-label="Giảm cỡ chữ">A−</button>
        <button class="icon-btn" id="fontUpBtn" title="Tăng cỡ chữ" aria-label="Tăng cỡ chữ">A+</button>
        <button class="text-btn" id="homeBtn">Trang chủ</button>
        <button class="text-btn" id="tocBtn">Mục lục</button>
      </div>
    </header>

    <main class="main">
      <div class="view">
        <section class="landing" id="landingView">
          <div class="hero">
            <img class="hero-cover" src="cover.jpeg" alt="Bìa Ai Bảo Hắn Tu Tiên" onerror="this.style.display='none'">
            <div>
              <h2>Ai Bảo Hắn Tu Tiên</h2>
              <div class="meta">
                <div>Tác giả: Tối Bạch Đích Ô Nha</div>
                <div id="chapterCountMeta">Đang tải mục lục…</div>
              </div>
              <div class="cta">
                <button class="primary-btn" id="startBtn">Đọc từ đầu</button>
                <button class="secondary-btn" id="resumeBtn" hidden>Tiếp tục đọc</button>
              </div>
            </div>
          </div>
          <div class="quick-jump">
            <label for="jumpInput">Nhảy tới chương</label>
            <input id="jumpInput" type="number" min="1" placeholder="1">
            <button class="text-btn" id="jumpBtn">Mở</button>
          </div>
        </section>

        <section class="reader-panel hidden" id="readerView">
          <div class="reader-head">
            <h2 id="chapterTitle">…</h2>
            <div class="sub" id="chapterMeta"></div>
          </div>
          <div id="chapterContent" class="chapter-body">
            <div class="loading">Đang tải chương…</div>
          </div>
        </section>
      </div>
    </main>

    <nav class="bottom-nav hidden" id="bottomNav">
      <button id="prevBtn">← Trước</button>
      <div class="center" id="navCenter">1 / 1</div>
      <button id="nextBtn">Sau →</button>
    </nav>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Mục lục">
    <div class="drawer-header">
      <h3>Mục lục</h3>
      <button class="icon-btn" id="closeDrawerBtn" aria-label="Đóng">✕</button>
    </div>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Tìm theo tiêu đề…">
    </div>
    <div class="toc" id="tocList"></div>
  </aside>

  <script>
    const STORAGE_KEY = "ai-bao-han-last-chapter";
    const FONT_KEY = "ai-bao-han-font-size";
    const MIN_FONT = 0.9;
    const MAX_FONT = 1.35;
    const FONT_STEP = 0.05;
    const TOC_WINDOW = 80;

    let chapters = [];
    let byN = {};
    let currentN = null;
    let searchQuery = "";
    const cache = new Map();

    const landingView = document.getElementById("landingView");
    const readerView = document.getElementById("readerView");
    const bottomNav = document.getElementById("bottomNav");
    const chapterTitle = document.getElementById("chapterTitle");
    const chapterMeta = document.getElementById("chapterMeta");
    const chapterContent = document.getElementById("chapterContent");
    const headerTitle = document.getElementById("headerTitle");
    const chapterCountMeta = document.getElementById("chapterCountMeta");
    const resumeBtn = document.getElementById("resumeBtn");
    const tocList = document.getElementById("tocList");
    const drawer = document.getElementById("drawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function textToHtml(text) {
      const paras = text.trim().split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
      if (!paras.length) return "<p>（Trống）</p>";
      return paras.map(p => `<p>${escapeHtml(p).replaceAll("\n", "<br>")}</p>`).join("");
    }

    function setFontSize(rem) {
      const clamped = Math.min(MAX_FONT, Math.max(MIN_FONT, rem));
      document.documentElement.style.setProperty("--font-size", `${clamped}rem`);
      localStorage.setItem(FONT_KEY, String(clamped));
    }

    function getSavedFontSize() {
      const raw = Number(localStorage.getItem(FONT_KEY));
      return Number.isFinite(raw) ? raw : 1.05;
    }

    function parseHash() {
      const match = location.hash.match(/^#ch=(\d+)$/);
      return match ? Number(match[1]) : null;
    }

    function setHash(n) {
      const next = `#ch=${n}`;
      if (location.hash !== next) history.pushState(null, "", next);
    }

    function showLanding() {
      landingView.classList.remove("hidden");
      readerView.classList.add("hidden");
      bottomNav.classList.add("hidden");
      headerTitle.textContent = "Ai Bảo Hắn Tu Tiên";
      currentN = null;
      location.hash = "";
    }

    function showReaderShell() {
      landingView.classList.add("hidden");
      readerView.classList.remove("hidden");
      bottomNav.classList.remove("hidden");
    }

    function updateNavButtons() {
      const idx = chapters.findIndex(c => c.n === currentN);
      document.getElementById("prevBtn").disabled = idx <= 0;
      document.getElementById("nextBtn").disabled = idx < 0 || idx >= chapters.length - 1;
      document.getElementById("navCenter").textContent =
        idx >= 0 ? `${currentN} / ${chapters.length}` : "—";
    }

    function filteredChapters() {
      const q = searchQuery.trim().toLowerCase();
      if (!q) return chapters;
      return chapters.filter(c => c.title.toLowerCase().includes(q));
    }

    function renderToc() {
      const list = filteredChapters();
      if (!list.length) {
        tocList.innerHTML = '<div class="toc-empty">Không có kết quả.</div>';
        return;
      }

      let slice = list;
      if (!searchQuery.trim() && currentN) {
        const centerIdx = list.findIndex(c => c.n === currentN);
        if (centerIdx >= 0) {
          const half = Math.floor(TOC_WINDOW / 2);
          const start = Math.max(0, centerIdx - half);
          const end = Math.min(list.length, start + TOC_WINDOW);
          slice = list.slice(start, end);
        } else {
          slice = list.slice(0, TOC_WINDOW);
        }
      } else if (!searchQuery.trim()) {
        slice = list.slice(0, TOC_WINDOW);
      }

      tocList.innerHTML = slice.map(c => `
        <button class="toc-item${c.n === currentN ? " active" : ""}" data-n="${c.n}">
          ${escapeHtml(c.title)}
        </button>
      `).join("");
    }

    async function loadChapterText(path) {
      if (cache.has(path)) return cache.get(path);
      const res = await fetch(path);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      cache.set(path, text);
      return text;
    }

    async function openChapter(n, { scrollTop = true } = {}) {
      const ch = byN[n];
      if (!ch) return;

      currentN = n;
      showReaderShell();
      chapterTitle.textContent = ch.title;
      chapterMeta.textContent = `${ch.story} · Chương ${n}`;
      headerTitle.textContent = ch.title;
      chapterContent.innerHTML = '<div class="loading">Đang tải chương…</div>';
      updateNavButtons();
      renderToc();
      setHash(n);
      localStorage.setItem(STORAGE_KEY, String(n));

      try {
        const text = await loadChapterText(ch.path);
        chapterContent.innerHTML = textToHtml(text);
      } catch (err) {
        chapterContent.innerHTML = `<div class="error">Không tải được chương: ${escapeHtml(String(err.message || err))}</div>`;
      }

      if (scrollTop) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openDrawer() {
      drawer.classList.add("open");
      drawerBackdrop.classList.add("open");
      renderToc();
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    async function init() {
      setFontSize(getSavedFontSize());

      const res = await fetch("chapters.json");
      if (!res.ok) throw new Error("Không tải được chapters.json");
      chapters = await res.json();
      byN = Object.fromEntries(chapters.map(c => [c.n, c]));

      chapterCountMeta.textContent = `${chapters.length.toLocaleString("vi-VN")} chương`;
      document.getElementById("jumpInput").max = String(chapters.length);

      const saved = Number(localStorage.getItem(STORAGE_KEY));
      if (Number.isFinite(saved) && byN[saved]) {
        resumeBtn.hidden = false;
        resumeBtn.onclick = () => openChapter(saved);
      }

      const hashN = parseHash();
      if (hashN && byN[hashN]) {
        await openChapter(hashN, { scrollTop: false });
      }
    }

    document.getElementById("startBtn").onclick = () => openChapter(1);
    document.getElementById("homeBtn").onclick = showLanding;
    document.getElementById("tocBtn").onclick = openDrawer;
    document.getElementById("closeDrawerBtn").onclick = closeDrawer;
    drawerBackdrop.onclick = closeDrawer;

    document.getElementById("jumpBtn").onclick = () => {
      const n = Number(document.getElementById("jumpInput").value);
      if (byN[n]) openChapter(n);
    };
    document.getElementById("jumpInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("jumpBtn").click();
    });

    document.getElementById("prevBtn").onclick = () => {
      const idx = chapters.findIndex(c => c.n === currentN);
      if (idx > 0) openChapter(chapters[idx - 1].n);
    };
    document.getElementById("nextBtn").onclick = () => {
      const idx = chapters.findIndex(c => c.n === currentN);
      if (idx >= 0 && idx < chapters.length - 1) openChapter(chapters[idx + 1].n);
    };

    document.getElementById("fontDownBtn").onclick = () => {
      const current = Number(getComputedStyle(document.documentElement).getPropertyValue("--font-size").replace("rem", "")) || 1.05;
      setFontSize(current - FONT_STEP);
    };
    document.getElementById("fontUpBtn").onclick = () => {
      const current = Number(getComputedStyle(document.documentElement).getPropertyValue("--font-size").replace("rem", "")) || 1.05;
      setFontSize(current + FONT_STEP);
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderToc();
    });

    tocList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-n]");
      if (!btn) return;
      openChapter(Number(btn.dataset.n));
      closeDrawer();
    });

    window.addEventListener("hashchange", () => {
      const n = parseHash();
      if (n && byN[n] && n !== currentN) openChapter(n, { scrollTop: false });
      if (!n && currentN !== null) showLanding();
    });

    window.addEventListener("keydown", (e) => {
      if (drawer.classList.contains("open") && e.key === "Escape") closeDrawer();
      if (currentN == null) return;
      if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
      if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
    });

    init().catch((err) => {
      chapterCountMeta.textContent = "Lỗi tải mục lục";
      console.error(err);
    });
  </script>
</body>
</html>

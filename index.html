<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <meta name="description" content="Đọc Ai Bảo Hắn Tu Tiên — tiểu thuyết tu tiên tiếng Việt">
  <title>Ai Bảo Hắn Tu Tiên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=LXGW+WenKai&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="progress-track hidden" id="progressTrack" aria-hidden="true">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="app" id="app">
    <!-- Home -->
    <section class="home" id="landingView">
      <div class="home-hero">
        <img class="home-hero__bg" src="cover.jpeg" alt="" onerror="this.style.display='none'">
        <div class="home-hero__overlay"></div>
        <div class="home-hero__content">
          <p class="home-hero__eyebrow">Tiểu thuyết tu tiên</p>
          <h1 class="home-hero__title">Ai Bảo Hắn Tu Tiên</h1>
          <p class="home-hero__author">Tối Bạch Đích Ô Nha</p>
          <div class="home-hero__chips">
            <span class="chip" id="chapterCountMeta">Đang tải…</span>
            <span class="chip">Tiếng Việt</span>
          </div>
        </div>
      </div>

      <div class="home-actions">
        <button class="btn btn--primary btn--block" id="startBtn">Đọc từ đầu</button>
        <button class="btn btn--secondary btn--block hidden" id="resumeBtn">Tiếp tục đọc</button>
        <div class="jump-row">
          <input class="jump-input" id="jumpInput" type="number" min="1" inputmode="numeric" placeholder="Số chương">
          <button class="btn btn--ghost" id="jumpBtn">Mở</button>
        </div>
      </div>
    </section>

    <!-- Reader -->
    <section class="reader hidden" id="readerView">
      <header class="reader-top" id="readerTop">
        <button class="icon-btn" id="homeBtn" aria-label="Trang chủ">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        </button>
        <div class="reader-top__meta">
          <h2 class="reader-top__title" id="chapterTitle">…</h2>
          <time class="chapter-updated hidden" id="chapterUpdated" datetime=""></time>
        </div>
        <span class="reader-top__count" id="navCenter">1/1</span>
      </header>

      <article class="chapter-body" id="chapterContent">
        <div class="skeleton">
          <div class="skeleton__line"></div>
          <div class="skeleton__line"></div>
          <div class="skeleton__line skeleton__line--short"></div>
        </div>
      </article>
    </section>
  </div>

  <!-- Bottom bar (reader) -->
  <nav class="bottom-bar hidden" id="bottomNav" aria-label="Điều hướng chương">
    <button class="bottom-bar__btn" id="prevBtn" aria-label="Chương trước">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Trước</span>
    </button>
    <button class="bottom-bar__btn bottom-bar__btn--center" id="tocBtn" aria-label="Mục lục">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Mục lục</span>
    </button>
    <button class="bottom-bar__btn bottom-bar__btn--center" id="settingsBtn" aria-label="Cài đặt">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span>Cài đặt</span>
    </button>
    <button class="bottom-bar__btn" id="nextBtn" aria-label="Chương sau">
      <span>Sau</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

  <!-- Sheet backdrop -->
  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true"></div>

  <!-- TOC sheet -->
  <aside class="sheet sheet--toc" id="tocSheet" role="dialog" aria-label="Mục lục" aria-hidden="true">
    <div class="sheet__handle" aria-hidden="true"></div>
    <div class="sheet__header">
      <h3>Mục lục</h3>
      <button class="icon-btn" id="closeTocBtn" aria-label="Đóng">✕</button>
    </div>
    <div class="sheet__search">
      <input id="searchInput" type="search" placeholder="Tìm theo tiêu đề…" autocomplete="off">
    </div>
    <div class="toc" id="tocList"></div>
  </aside>

  <!-- Settings sheet -->
  <aside class="sheet sheet--settings" id="settingsSheet" role="dialog" aria-label="Cài đặt" aria-hidden="true">
    <div class="sheet__handle" aria-hidden="true"></div>
    <div class="sheet__header">
      <h3>Cài đặt đọc</h3>
      <button class="icon-btn" id="closeSettingsBtn" aria-label="Đóng">✕</button>
    </div>
    <div class="settings-body">
      <label class="setting-row">
        <span>Cỡ chữ</span>
        <div class="setting-row__control">
          <input type="range" id="fontSlider" min="0.9" max="1.4" step="0.05" value="1.05">
          <span class="setting-value" id="fontValue">105%</span>
        </div>
      </label>
      <div class="setting-row">
        <span>Giao diện</span>
        <div class="theme-toggle" role="group" aria-label="Chọn giao diện">
          <button type="button" class="theme-toggle__btn" id="themeDarkBtn" data-theme="dark">Tối</button>
          <button type="button" class="theme-toggle__btn" id="themeLightBtn" data-theme="light">Sáng</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Desktop TOC panel -->
  <aside class="desktop-toc hidden" id="desktopToc" aria-label="Mục lục">
    <h3 class="desktop-toc__header">Mục lục</h3>
    <div class="desktop-toc__search">
      <input id="desktopSearchInput" type="search" placeholder="Tìm chương…" autocomplete="off">
    </div>
    <div class="toc" id="desktopTocList"></div>
  </aside>

  <script src="assets/virtual-toc.js?v=2" defer></script>
  <script src="assets/app.js?v=2" defer></script>
</body>
</html>
